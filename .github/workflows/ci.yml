name: CI

on:
  push:
    branches: [main, feat/custody-record-truthfulness, build/production-foundation]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install test deps
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Validate OpenAPI spec
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -c "import sys; sys.path.insert(0, 'service/scripts'); import server; from openapi_spec_validator import validate; validate(server.openapi_spec())"

      - name: Smoke (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python service/scripts/clean_text.py tests/fixtures/sample_watermarked.txt -o "$env:TEMP/wm.cleaned.txt" --stats &&
          python service/scripts/rewrite_text.py tests/fixtures/sample_watermarked.txt --backend print-prompt > $null &&
          python service/scripts/clean_file.py tests/fixtures/sample_ai.md -o "$env:TEMP/sample_ai.cleaned.md" &&
          python service/scripts/clean_file.py tests/fixtures/sample_ai.html -o "$env:TEMP/sample_ai.cleaned.html" &&
          python service/scripts/clean_file.py tests/fixtures/sample_meta.svg -o "$env:TEMP/sample_meta.cleaned.svg"

      - name: Validate setup .ps1 scripts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @('research/harnesses/setup_ctrlregen.ps1', 'research/harnesses/setup_synthid.ps1')
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
          $ps1 = Get-Content research/harnesses/setup_ctrlregen.ps1 -Raw
          if ($ps1 -notmatch 'cuda\.is_available\(\)') { Write-Error 'post-install CUDA verification missing'; exit 1 }

      - name: Audit dependencies (pip-audit)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip_audit -r requirements-dev.txt \
            -r service/requirements-app.txt \
            -r research/harnesses/requirements-synthid-scorer.txt

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install test deps
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check service tests

      - name: Format check
        run: python -m ruff format --check service tests

  web:
    name: Web tests, lint, and static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  worker-image:
    name: Production worker image and packet workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Build and pin the actual worker image
        run: |
          docker run -d --name counselclear-ci-registry -p 127.0.0.1:5000:5000 registry:2
          docker build -f service/Dockerfile.counselclear -t localhost:5000/counselclear:ci service
          docker push localhost:5000/counselclear:ci
          IMAGE=$(docker image inspect localhost:5000/counselclear:ci --format '{{index .RepoDigests 0}}')
          echo "COUNSELCLEAR_TEST_WORKER_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Exercise upload, inspect, release, and packet download
        run: python -m pytest tests/test_worker_docker_smoke.py -v
