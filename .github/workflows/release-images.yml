name: release-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Commercial-surface publish matrix.
#
# This workflow publishes ONLY the CounselClear product image
# (service/Dockerfile.counselclear). The `markllm` and `markdiffusion`
# research-harness images are deliberately NOT built or published here:
# per docs/COUNSELCLEAR_COMMERCIAL_SURFACE.md §3.2 / §7 they are classified
# `build-exclude` + `legal-review-needed` and must not appear in any
# commercial release path. The CtrlRegen and reverse-SynthID images are
# `hard-block` and are local-build-only (never pushed) by construction.
# Do not re-add harness images to this matrix without a separate legal
# clearance recorded in the commercial surface manifest.
jobs:
  build-counselclear:
    name: Build and publish CounselClear image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          TAG="${{ github.ref_name }}"
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tags=ghcr.io/${REPO_LC}-counselclear:${TAG},ghcr.io/${REPO_LC}-counselclear:latest" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: service
          file: service/Dockerfile.counselclear
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
