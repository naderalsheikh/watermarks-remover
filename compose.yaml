# Whole-infra bring-up for watermarks-remover.
#
#   docker compose up --build -d            # core HTTP service only
#   docker compose --profile harness up --build -d   # + markllm / markdiffusion harnesses
#   docker compose --profile heavy up --build -d     # + ctrlregen / synthid (local builds)
#
# The skill and any web app talk to the wr-core service at http://127.0.0.1:8765
# (loopback-only host mapping). The heavy/harness images are one-shot CLIs:
# `up` starts them with `--help` to confirm the image, and real jobs run via
# `docker compose run`, e.g.:
#   docker compose run --rm wr-ctrlregen /data/shot.png -o /data/out.png
#
# ctrlregen and synthid bake in upstream code that is not publicly
# redistributable (all-rights-reserved / non-commercial Research License), so
# they build from source locally and are never pushed to GHCR.

name: watermarks-remover

# CounselClear legal profile (core only — no harness/heavy services):
#   docker compose --profile legal up --build cc-api
#   docker compose --profile legal run --rm cc-worker \
#     inspect /data/matter.docx
# The API never parses untrusted bytes: jobs execute via per-job workers.
# Production pins both images by digest (repo@sha256:...); the worker
# refuses to start otherwise (app.runner enforces the pin at run time).
services:
  cc-api:
    profiles: [legal]
    build:
      context: service
      dockerfile: Dockerfile.counselclear
    environment:
      COUNSELCLEAR_DATA_ROOT: /data
      # Required only when OIDC SSO is not configured (the app enforces this
      # itself: with COUNSELCLEAR_OIDC_* set below, no password hash is used).
      COUNSELCLEAR_LOCAL_PASSWORD: ${COUNSELCLEAR_LOCAL_PASSWORD:-}
      # Optional OIDC SSO (Phase 3): all three of ISSUER/CLIENT_ID/CLIENT_SECRET
      # enable it, local login is then disabled. ALLOWED is a fail-closed
      # comma-separated email/sub allowlist — empty denies everyone.
      COUNSELCLEAR_OIDC_ISSUER: ${COUNSELCLEAR_OIDC_ISSUER:-}
      COUNSELCLEAR_OIDC_CLIENT_ID: ${COUNSELCLEAR_OIDC_CLIENT_ID:-}
      COUNSELCLEAR_OIDC_CLIENT_SECRET: ${COUNSELCLEAR_OIDC_CLIENT_SECRET:-}
      COUNSELCLEAR_OIDC_ALLOWED: ${COUNSELCLEAR_OIDC_ALLOWED:-}
      COUNSELCLEAR_WORKER_MODE: ${COUNSELCLEAR_WORKER_MODE:-docker}
      COUNSELCLEAR_WORKER_IMAGE: ${COUNSELCLEAR_WORKER_IMAGE:-}
      # Optional hardened OCI runtime (e.g. runsc/gVisor) for per-job worker
      # containers; must be registered with Docker on the host first.
      COUNSELCLEAR_WORKER_RUNTIME: ${COUNSELCLEAR_WORKER_RUNTIME:-}
      # Empty = embedded SQLite (single-tenant default). Set to point at an
      # external managed Postgres instead, or bring up the bundled one with
      #   docker compose --profile legal --profile pg up -d cc-api
      # plus COUNSELCLEAR_DATABASE_URL from .env (see .env.example).
      COUNSELCLEAR_DATABASE_URL: ${COUNSELCLEAR_DATABASE_URL:-}
      # Docs (/docs, /openapi.json) are fail-closed — opt in explicitly for
      # local development only.
      COUNSELCLEAR_ENABLE_DOCS: ${COUNSELCLEAR_ENABLE_DOCS:-}
      # Live ClamAV definitions from the cc-freshclam sidecar (falls back to
      # the image's build-time seed when the sidecar/volume is absent).
      COUNSELCLEAR_CLAMAV_DB_DIR: /clamav-defs
    depends_on:
      # Optional: only enforced when cc-postgres is actually started (the
      # pg profile). Keeps SQLite-only deployments dependency-free.
      cc-postgres:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - cc-data:/data
      - clamav-db:/clamav-defs:ro
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Keeps the shared ClamAV definition volume current (build-time seeds go
  # stale within days). Needs egress to database.clamav.net:443 — this is
  # the only legal-profile service with network access; job workers never.
  cc-freshclam:
    profiles: [legal]
    build:
      context: service
      dockerfile: Dockerfile.counselclear
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /defs
        cp -n /var/lib/clamav/* /defs/ 2>/dev/null || true
        while true; do
          freshclam --datadir=/defs --stdout \
            || echo "freshclam update failed; retrying next cycle"
          sleep 21600
        done
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    init: true
    volumes:
      - clamav-db:/defs
    restart: unless-stopped

  # One-shot job worker; normally spawned per job by the API's runner with
  # --network none. This service exists for hand-runs against /data.
  cc-worker:
    profiles: [legal]
    build:
      context: service
      dockerfile: Dockerfile.counselclear
    entrypoint: ["python3", "-m", "app.worker"]
    command: ["--help"]
    environment:
      COUNSELCLEAR_DATA_ROOT: /data
    volumes:
      - cc-data:/data
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    network_mode: none

  # Optional bundled Postgres for the legal profile (pg profile): shared
  # state for multi-replica API deployments, or simply a real server instead
  # of the embedded SQLite file. Enable together with COUNSELCLEAR_DATABASE_URL
  # in .env (see .env.example); the API waits for its healthcheck before
  # running migrations. Production with a managed Postgres should skip this
  # service entirely and set COUNSELCLEAR_DATABASE_URL directly. Digest-pin
  # the image for production (repo convention: see docs/COUNSELCLEAR_DESIGN.md).
  cc-postgres:
    profiles: [pg]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${COUNSELCLEAR_PG_USER:-counselclear}
      POSTGRES_PASSWORD: ${COUNSELCLEAR_PG_PASSWORD:?required}
      POSTGRES_DB: ${COUNSELCLEAR_PG_DB:-counselclear}
    volumes:
      - cc-pgdata:/var/lib/postgresql/data
    # DB reachable only from the compose network — no host port mapping.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    init: true
    restart: unless-stopped

  wr-core:
    build:
      context: service
      dockerfile: Dockerfile
    image: ghcr.io/guillaumemeyer/watermarks-remover:latest
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # Empty by default (no auth). Set to require `Authorization: Bearer <key>`.
      WATERMARKS_SERVER_API_KEY: ${WATERMARKS_SERVER_API_KEY:-}
      # Optional SynthID image scorer sidecar (heavy profile).
      WATERMARKS_SYNTHID_SCORER_URL: ${WATERMARKS_SYNTHID_SCORER_URL:-}
      WATERMARKS_SYNTHID_SCORER_API_KEY: ${WATERMARKS_SYNTHID_SCORER_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    restart: unless-stopped

  wr-markllm:
    profiles: [harness]
    build:
      context: service
      dockerfile: Dockerfile.markllm
    image: ghcr.io/guillaumemeyer/watermarks-remover:markllm-latest
    # One-shot CLI: `up` just confirms the image; run real jobs with
    # `docker compose run --rm wr-markllm detect /data/wm.txt --scheme kgw`.
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /home/markllm/.cache/huggingface
      # Layer B rewrite backend (openai-compatible / ollama).
      WATERMARKS_REWRITE_BACKEND: ${WATERMARKS_REWRITE_BACKEND:-}
      WATERMARKS_REWRITE_MODEL: ${WATERMARKS_REWRITE_MODEL:-}
      WATERMARKS_REWRITE_BASE_URL: ${WATERMARKS_REWRITE_BASE_URL:-}
      WATERMARKS_REWRITE_API_KEY: ${WATERMARKS_REWRITE_API_KEY:-}
      WATERMARKS_REWRITE_ALLOW_REMOTE: ${WATERMARKS_REWRITE_ALLOW_REMOTE:-}
      WATERMARKS_REWRITE_REASONING_EFFORT: ${WATERMARKS_REWRITE_REASONING_EFFORT:-}
    volumes:
      - markllm-cache:/home/markllm/.cache/huggingface
      # Writable output for the benchmark + the bundled seed corpus (the
      # build context is service/, so the corpus is mounted at runtime):
      #   docker compose run --rm wr-markllm \
      #     /app/bench_synthid_text.py --markllm-dir /opt/markllm \
      #     --corpus /bench-corpus --out-dir /data ...
      - bench-out:/data
      - ./benchmarks/corpus:/bench-corpus:ro

  wr-markdiffusion:
    profiles: [harness]
    build:
      context: service
      dockerfile: Dockerfile.markdiffusion
    image: ghcr.io/guillaumemeyer/watermarks-remover:markdiffusion-latest
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /home/markdiffusion/.cache/huggingface
    volumes:
      - markdiffusion-cache:/home/markdiffusion/.cache/huggingface

  wr-ctrlregen:
    profiles: [heavy]
    build:
      context: service
      dockerfile: Dockerfile.ctrlregen
    # Local-only tag: upstream `noai-watermark` ships no LICENSE (all-rights-
    # reserved), so this image is never published.
    image: watermarks-remover-ctrlregen:local
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      NOAI_WATERMARK_DIR: /opt/noai-watermark
    volumes:
      - ctrlregen-cache:/home/remover/.cache/huggingface

  wr-synthid:
    profiles: [heavy]
    build:
      context: service
      dockerfile: Dockerfile.synthid
    # Local-only tag: upstream `reverse-SynthID` is under a non-commercial
    # Research License, so this image is never published.
    image: watermarks-remover-synthid-scorer:local
    command: ["--help"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    volumes:
      - synthid-cache:/home/scorer/.cache/huggingface

  # HTTP SynthID scorer sidecar: lets wr-core score images before/after
  # cleaning without bundling the non-commercial reverse-SynthID code in the
  # published core image. Reach it via WATERMARKS_SYNTHID_SCORER_URL on
  # wr-core (see .env.example) and require the same bearer key on both sides.
  wr-synthid-score:
    profiles: [heavy]
    build:
      context: service
      dockerfile: Dockerfile.synthid
    image: watermarks-remover-synthid-scorer:local
    entrypoint: ["python3"]
    command: ["/app/synthid_score_server.py", "--host", "0.0.0.0", "--port", "8766"]
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    environment:
      WATERMARKS_SYNTHID_SCORER_API_KEY: ${WATERMARKS_SYNTHID_SCORER_API_KEY:-}
      REVERSE_SYNTHID_DIR: /opt/reverse-synthid
    volumes:
      - synthid-cache:/home/scorer/.cache/huggingface

volumes:
  cc-data:
  cc-pgdata:
  clamav-db:
  markllm-cache:
  bench-out:
  markdiffusion-cache:
  ctrlregen-cache:
  synthid-cache:
